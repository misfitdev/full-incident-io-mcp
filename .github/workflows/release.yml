name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Build the server, package it into a tarball, and emit the sha256 hash of
  # that tarball as a job output for the SLSA provenance step.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Build
        run: npm run build
        working-directory: server

      - name: Package tarball
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          artifact="incident-api-mcp-${version}.tgz"
          tar -czf "${artifact}" \
            -C server build package.json package-lock.json \
            -C "${GITHUB_WORKSPACE}" spec
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"

      - name: Generate subject hash
        id: hash
        run: |
          echo "hashes=$(sha256sum "${{ steps.package.outputs.artifact }}" | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

  # Create the GitHub release and attach the tarball. Runs before provenance so
  # the release exists when the SLSA generator uploads provenance to it.
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ${{ needs.build.outputs.artifact }}
          generate_release_notes: true

  # SLSA Build L2 provenance for the tarball. The generic generator is a
  # reusable workflow and MUST be referenced by a full semver tag (not a SHA).
  # Runs after the release exists so upload-assets attaches provenance to it.
  provenance:
    needs: [build, release]
    permissions:
      actions: read # detect the GitHub Actions environment
      id-token: write # sign provenance via Sigstore
      contents: write # upload provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      provenance-name: incident-api-mcp.intoto.jsonl
